# Orclab is a Claude Code plugin, not a package anyone pip-installs. This table exists for one
# reason: `pip_audit .` reads [project].dependencies and nothing else, so without it Orclab's own
# audit gate had nothing to check and said "nothing declared" on every push (BACKLOG #84). PyYAML
# is genuinely required — four shipped modules import it at module level.
#
# Adding this also makes pyproject.toml a version file: versionfiles.py counts it only when a
# [project] table is present, so `/orc-version` now writes three files and `version-verify`
# requires all three to agree.
[project]
name = "orclab"
version = "0.27.0"
requires-python = ">=3.11"        # tomllib, used by versionfiles.py and langs/python.py
dependencies = ["PyYAML"]

[tool.pytest.ini_options]
testpaths = ["skills", "hooks"]
norecursedirs = ["mutants", "venv", ".orclab"]
addopts = "--import-mode=importlib"
pythonpath = [
  "hooks/scripts",
  "skills/orc-package/scripts",
  "skills/orc-publish/scripts",
  "skills/orc-release/scripts",
  "skills/orc-test/scripts",
  "skills/orc-todo/scripts",
]

# code-discipline's checkable rules, exactly as skills/stack-python-desktop/SKILL.md's Lint
# section gives them to a consuming project (BACKLOG #40). lint_on_write runs this on every write.
[tool.ruff]
preview = true                      # PLR1702 has been a preview rule since 0.1.15
extend-exclude = ["mutants", "venv", ".orclab"]
[tool.ruff.lint]
extend-select = ["PLR1702", "PLR0915", "E722", "S110"]
[tool.ruff.lint.pylint]
max-nested-blocks = 2               # ruff's default is 5
max-statements = 50                 # ruff's default; statements, not lines — about a printed page
